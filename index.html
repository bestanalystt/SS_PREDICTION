/* HEADING */

/* BUTTON WRAPPER */
.button{
    margin:15px;
}

/* BUTTON EFFECTS (DONO BUTTON KE LIYE) */
.button .btn{
    position:relative;
    display:block;
    overflow:hidden;
    padding:15px 20px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    text-decoration:none;
    color:#fff !important;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    transition:0.3s ease;
}

.button .btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.35);
    transform:skewX(-20deg);
}

.button .btn:hover::before{
    animation:stripe 0.7s linear;
}

.button .btn:hover{
    transform:scale(1.06);
    box-shadow:0 0 20px rgba(0,198,255,0.9);
}

.button .btn:active{
    transform:scale(0.95);
}

@keyframes stripe{
    from{left:-120%;}
    to{left:120%;}
}

/* POINTS */
.points ul{
    list-style:none;
    padding:0;
    margin:18px auto;
    display:inline-block;
    text-align:left;
}

.points li{
    margin:8px 0;
    font-size:17px;
}

<!-- SUBSCRIBER COUNTER -->
<script>
const targetCount = 74028;
const duration = 2000;
const displayElement = document.getElementById('subscriber-count');
let start = null;

function countUp(timestamp){
    if(!start) start = timestamp;
    const progress = timestamp - start;
    const count = Math.min(
        Math.floor((progress / duration) * targetCount),
        targetCount
    );
    displayElement.textContent = count.toLocaleString() + " Subscribers";
    if(count < targetCount) requestAnimationFrame(countUp);
}
requestAnimationFrame(countUp);
</script>
